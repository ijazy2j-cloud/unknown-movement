<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="#0D0D10"/>
  <!-- Orange side-bar accent (top-left edge detail) -->
  <rect x="0" y="0" width="16" height="512" rx="0" fill="#FC4C02" opacity="0" />
  <!-- UM monogram, bold, centred -->
  <text
    x="256"
    y="340"
    font-family="'Arial Black','Arial',system-ui,sans-serif"
    font-size="240"
    font-weight="900"
    fill="#FC4C02"
    text-anchor="middle"
    letter-spacing="-12"
  >UM</text>
  <!-- Thin orange underline accent -->
  <rect x="136" y="364" width="240" height="10" rx="5" fill="#FC4C02" opacity="0.35"/>
</svg>
