<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Island Pace — UX/UI Design Direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: 'DM Sans', sans-serif; }
  #root { width: 100%; height: 100%; }

  /* ── Island Pace Design Tokens ── */
  :root {
    --ip-bg:        oklch(97.5% 0.006 80);
    --ip-bg2:       oklch(95% 0.008 75);
    --ip-surface:   oklch(99% 0.003 80);
    --ip-border:    oklch(88% 0.01 75);
    --ip-text:      oklch(14% 0.01 250);
    --ip-text-2:    oklch(42% 0.015 240);
    --ip-text-3:    oklch(62% 0.01 220);
    --ip-accent:    oklch(62% 0.18 38);
    --ip-accent-lt: oklch(94% 0.06 60);
    --ip-green:     oklch(55% 0.14 148);
    --ip-green-lt:  oklch(93% 0.05 148);
    --ip-blue:      oklch(55% 0.14 248);
    --ip-blue-lt:   oklch(93% 0.05 248);
    --ip-radius:    8px;
    --ip-radius-lg: 14px;
    --ip-shadow:    0 1px 4px oklch(14% 0.01 250 / 0.07), 0 4px 16px oklch(14% 0.01 250 / 0.06);
    --ip-shadow-lg: 0 4px 24px oklch(14% 0.01 250 / 0.12);
  }

  /* ── Shared screen styles ── */
  .ip-screen {
    background: var(--ip-bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--ip-text);
    width: 390px;
    min-height: 844px;
    overflow-y: auto;
    overflow-x: hidden;
    border-radius: 0;
    position: relative;
    -webkit-font-smoothing: antialiased;
    scrollbar-width: none;
  }
  .ip-screen::-webkit-scrollbar { display: none; }

  /* ── Nav bar ── */
  .ip-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 14px;
    background: var(--ip-surface);
    border-bottom: 1px solid var(--ip-border);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .ip-logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ip-text);
  }
  .ip-logo span { color: var(--ip-accent); }
  .ip-nav-actions { display: flex; gap: 8px; align-items: center; }
  .ip-nav-btn {
    background: none; border: none; cursor: pointer;
    color: var(--ip-text-2); font-size: 18px; padding: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .ip-nav-pill {
    background: var(--ip-accent); color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 600;
    padding: 6px 14px; border-radius: 20px; border: none;
    cursor: pointer; letter-spacing: 0.01em;
    white-space: nowrap;
  }

  /* ── Badges ── */
  .ip-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 4px;
    letter-spacing: 0.02em; text-transform: uppercase;
    white-space: nowrap;
  }
  .ip-badge-ride    { background: var(--ip-accent-lt); color: var(--ip-accent); }
  .ip-badge-run     { background: var(--ip-blue-lt);   color: var(--ip-blue); }
  .ip-badge-tri     { background: oklch(93% 0.05 310); color: oklch(48% 0.14 310); }
  .ip-badge-social  { background: oklch(93% 0.04 180); color: oklch(42% 0.12 180); }
  .ip-badge-coffee  { background: oklch(93% 0.06 55);  color: oklch(44% 0.14 55); }
  .ip-badge-nodrop  { background: var(--ip-green-lt);  color: var(--ip-green); }
  .ip-badge-tourist { background: oklch(93% 0.06 280); color: oklch(44% 0.14 280); }
  .ip-badge-beginner{ background: var(--ip-green-lt);  color: var(--ip-green); }
  .ip-badge-hard    { background: oklch(94% 0.06 20);  color: oklch(48% 0.18 20); }
  .ip-badge-tag     { background: var(--ip-bg2); color: var(--ip-text-2); border: 1px solid var(--ip-border); }
  .ip-badge-women   { background: oklch(93% 0.05 340); color: oklch(44% 0.14 340); }

  /* ── Session cards ── */
  .ip-card {
    background: var(--ip-surface);
    border: 1px solid var(--ip-border);
    border-radius: var(--ip-radius-lg);
    padding: 16px;
    box-shadow: var(--ip-shadow);
    transition: box-shadow 0.18s, transform 0.18s;
    cursor: pointer;
  }
  .ip-card:hover {
    box-shadow: var(--ip-shadow-lg);
    transform: translateY(-1px);
  }
  .ip-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
  .ip-card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 19px; font-weight: 700;
    line-height: 1.15;
    color: var(--ip-text);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    flex: 1;
  }
  .ip-card-meta {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 10px;
  }
  .ip-card-meta-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--ip-text-2);
    flex-wrap: wrap;
  }
  .ip-card-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ip-border); flex-shrink: 0; }
  .ip-card-stat {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px; font-weight: 600;
    color: var(--ip-text);
  }
  .ip-card-stat-label { font-size: 11px; color: var(--ip-text-3); font-weight: 400; }
  .ip-card-stats-row { display: flex; gap: 16px; margin-bottom: 10px; padding: 10px 0; border-top: 1px solid var(--ip-border); border-bottom: 1px solid var(--ip-border); }
  .ip-card-stat-block { display: flex; flex-direction: column; gap: 1px; }
  .ip-card-badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .ip-card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .ip-card-organiser { display: flex; align-items: center; gap: 6px; }
  .ip-card-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--ip-accent-lt); 
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: var(--ip-accent);
  }
  .ip-card-organiser-name { font-size: 12px; color: var(--ip-text-2); }
  .ip-card-joining { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ip-text-3); }
  .ip-card-joining strong { color: var(--ip-text); font-weight: 600; }

  /* ── Date chip ── */
  .ip-date-chip {
    display: flex; flex-direction: column; align-items: center;
    background: var(--ip-text); color: white;
    border-radius: 8px; padding: 6px 10px; min-width: 44px;
    flex-shrink: 0;
  }
  .ip-date-chip-day { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; line-height: 1; }
  .ip-date-chip-dow { font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; }

  /* ── Section headers ── */
  .ip-section-hd {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 20px 20px 12px;
  }
  .ip-section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .ip-section-link { font-size: 13px; color: var(--ip-accent); font-weight: 500; }

  /* ── Buttons ── */
  .ip-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600;
    padding: 11px 20px; border-radius: 8px; border: none;
    cursor: pointer; transition: opacity 0.15s, transform 0.12s;
    white-space: nowrap;
  }
  .ip-btn:active { transform: scale(0.98); }
  .ip-btn-primary { background: var(--ip-accent); color: white; }
  .ip-btn-secondary { background: var(--ip-text); color: white; }
  .ip-btn-outline { background: transparent; color: var(--ip-text); border: 1.5px solid var(--ip-border); }
  .ip-btn-ghost { background: var(--ip-bg2); color: var(--ip-text-2); }
  .ip-btn-full { width: 100%; }
  .ip-btn-sm { font-size: 13px; padding: 8px 14px; }

  /* ── Chip filters ── */
  .ip-chips { display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto; scrollbar-width: none; }
  .ip-chips::-webkit-scrollbar { display: none; }
  .ip-chip {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    padding: 7px 14px; border-radius: 20px;
    border: 1.5px solid var(--ip-border);
    background: var(--ip-surface); color: var(--ip-text-2);
    white-space: nowrap; cursor: pointer;
    transition: all 0.15s;
  }
  .ip-chip.active {
    background: var(--ip-text); color: white; border-color: var(--ip-text);
  }

  /* ── Hero ── */
  .ip-hero {
    background: var(--ip-text);
    padding: 32px 20px 28px;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .ip-hero::before {
    content: '';
    position: absolute; top: -60px; right: -40px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: var(--ip-accent);
    opacity: 0.12;
  }
  .ip-hero-tag {
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ip-accent);
    margin-bottom: 10px;
  }
  .ip-hero-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 38px; font-weight: 800;
    line-height: 1.05; text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }
  .ip-hero-title em { color: var(--ip-accent); font-style: normal; }
  .ip-hero-sub {
    font-size: 14px; color: oklch(80% 0.01 250);
    line-height: 1.55; margin-bottom: 22px; max-width: 320px;
  }
  .ip-hero-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .ip-hero-btn-primary {
    background: var(--ip-accent); color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600;
    padding: 12px 22px; border-radius: 8px; border: none;
    cursor: pointer;
  }
  .ip-hero-btn-secondary {
    background: transparent; color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    padding: 12px 22px; border-radius: 8px;
    border: 1.5px solid oklch(100% 0 0 / 0.25);
    cursor: pointer;
  }

  /* ── Weekend pill ── */
  .ip-weekend-band {
    background: var(--ip-accent-lt);
    border: 1px solid oklch(88% 0.08 50);
    border-radius: 8px; margin: 0 20px 0;
    padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .ip-weekend-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ip-accent);
  }
  .ip-weekend-count { font-size: 12px; color: var(--ip-accent); font-weight: 500; }

  /* ── Stats bar ── */
  .ip-stats-bar {
    display: flex; gap: 0;
    border: 1px solid var(--ip-border);
    border-radius: var(--ip-radius);
    background: var(--ip-surface);
    margin: 0 20px;
    overflow: hidden;
  }
  .ip-stat-item {
    flex: 1; padding: 12px 8px; text-align: center;
    border-right: 1px solid var(--ip-border);
  }
  .ip-stat-item:last-child { border-right: none; }
  .ip-stat-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px; font-weight: 700; color: var(--ip-text);
    display: block;
  }
  .ip-stat-lbl { font-size: 10px; font-weight: 500; color: var(--ip-text-3); text-transform: uppercase; letter-spacing: 0.06em; }

  /* ── Input / Form ── */
  .ip-field { display: flex; flex-direction: column; gap: 5px; }
  .ip-label { font-size: 12px; font-weight: 600; color: var(--ip-text-2); text-transform: uppercase; letter-spacing: 0.06em; }
  .ip-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; color: var(--ip-text);
    background: var(--ip-surface);
    border: 1.5px solid var(--ip-border);
    border-radius: var(--ip-radius);
    padding: 11px 14px; outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  .ip-input:focus { border-color: var(--ip-accent); }
  .ip-input::placeholder { color: var(--ip-text-3); }
  .ip-select {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; color: var(--ip-text);
    background: var(--ip-surface);
    border: 1.5px solid var(--ip-border);
    border-radius: var(--ip-radius);
    padding: 11px 14px; outline: none; width: 100%;
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%23888' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }
  .ip-toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--ip-border);
  }
  .ip-toggle-label { font-size: 14px; color: var(--ip-text); font-weight: 500; }
  .ip-toggle-sub { font-size: 12px; color: var(--ip-text-3); }
  .ip-toggle {
    width: 40px; height: 24px; border-radius: 12px;
    background: var(--ip-green); border: none; cursor: pointer;
    position: relative; flex-shrink: 0;
  }
  .ip-toggle::after {
    content: ''; position: absolute; top: 2px; right: 2px;
    width: 20px; height: 20px; border-radius: 50%;
    background: white;
  }
  .ip-toggle.off { background: var(--ip-border); }
  .ip-toggle.off::after { right: auto; left: 2px; }

  /* ── Step indicator ── */
  .ip-stepper { display: flex; align-items: center; gap: 0; padding: 16px 20px; }
  .ip-step {
    flex: 1; height: 3px; background: var(--ip-border);
    position: relative; transition: background 0.3s;
  }
  .ip-step.done { background: var(--ip-accent); }
  .ip-step.active { background: var(--ip-accent); }
  .ip-step-gap { width: 8px; flex-shrink: 0; }
  .ip-stepper-label { font-size: 12px; color: var(--ip-text-3); padding: 0 20px 12px; font-weight: 500; }
  .ip-stepper-label strong { color: var(--ip-text); }

  /* ── Detail sections ── */
  .ip-detail-hero {
    background: var(--ip-text); color: white;
    padding: 24px 20px 20px;
    position: relative; overflow: hidden;
  }
  .ip-detail-hero::after {
    content: '';
    position: absolute; bottom: -30px; right: -30px;
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--ip-accent); opacity: 0.15;
  }
  .ip-detail-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 30px; font-weight: 800; text-transform: uppercase;
    line-height: 1.08; letter-spacing: 0.02em; margin: 10px 0 6px;
  }
  .ip-detail-meta-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: oklch(75% 0.01 250); flex-wrap: wrap; }
  .ip-detail-meta-dot { color: oklch(50% 0.01 250); }
  .ip-quick-stats {
    background: var(--ip-surface); border: 1px solid var(--ip-border);
    border-radius: var(--ip-radius-lg); margin: 16px 20px 0;
    overflow: hidden; box-shadow: var(--ip-shadow);
  }
  .ip-quick-stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .ip-qs-item { padding: 14px 12px; border-right: 1px solid var(--ip-border); text-align: center; }
  .ip-qs-item:last-child { border-right: none; }
  .ip-qs-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px; font-weight: 700; color: var(--ip-text); display: block;
  }
  .ip-qs-unit { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 500; color: var(--ip-text-3); }
  .ip-qs-label { font-size: 10px; color: var(--ip-text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  .ip-detail-section { padding: 16px 20px; border-bottom: 1px solid var(--ip-border); }
  .ip-detail-section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ip-text-2); margin-bottom: 12px;
  }

  /* ── Route placeholder ── */
  .ip-route-placeholder {
    background: var(--ip-bg2);
    border: 1px solid var(--ip-border);
    border-radius: var(--ip-radius);
    height: 120px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .ip-route-placeholder-inner {
    font-size: 11px; color: var(--ip-text-3); font-family: monospace; text-align: center; line-height: 1.6;
  }
  .ip-route-grid {
    position: absolute; inset: 0;
    background-image: 
      linear-gradient(var(--ip-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--ip-border) 1px, transparent 1px);
    background-size: 20px 20px;
    opacity: 0.5;
  }
  .ip-route-path {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── Organiser card ── */
  .ip-organiser-card {
    display: flex; gap: 12px; align-items: flex-start;
  }
  .ip-organiser-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--ip-accent-lt);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px; font-weight: 700; color: var(--ip-accent);
    flex-shrink: 0;
  }
  .ip-organiser-name { font-size: 15px; font-weight: 600; }
  .ip-organiser-club { font-size: 13px; color: var(--ip-text-3); margin-top: 1px; }
  .ip-contact-btns { display: flex; gap: 8px; margin-top: 10px; }

  /* ── CTA strip ── */
  .ip-cta-strip { padding: 16px 20px; display: flex; gap: 8px; background: var(--ip-surface); border-top: 1px solid var(--ip-border); position: sticky; bottom: 0; }

  /* ── Calendar event dot ── */
  .ip-cal-event { 
    background: var(--ip-surface); border: 1px solid var(--ip-border);
    border-radius: var(--ip-radius); padding: 12px 14px;
    display: flex; gap: 12px; align-items: flex-start;
    box-shadow: var(--ip-shadow);
  }
  .ip-cal-date { 
    min-width: 44px; text-align: center;
    background: var(--ip-text); color: white; border-radius: 8px;
    padding: 6px 8px;
  }
  .ip-cal-d { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; line-height: 1; display: block; }
  .ip-cal-m { font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; }
  .ip-cal-body { flex: 1; }
  .ip-cal-title { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
  .ip-cal-meta { font-size: 12px; color: var(--ip-text-3); margin-top: 3px; }
  .ip-cal-badge { margin-top: 6px; }

  /* ── Club cards ── */
  .ip-club-card {
    background: var(--ip-surface); border: 1px solid var(--ip-border);
    border-radius: var(--ip-radius-lg); padding: 14px;
    display: flex; gap: 12px; align-items: center;
    box-shadow: var(--ip-shadow);
  }
  .ip-club-logo {
    width: 48px; height: 48px; border-radius: 10px;
    background: var(--ip-text); display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800;
    color: white; flex-shrink: 0;
  }

      {/* Cards with heavier design */}
      <div style={{ padding: '0 20px' }}>
        {[
          { title: 'Colombo Coffee Loop', type: 'Ride', day: '03', dow: 'SAT', time: '6:00 AM', km: '42', pace: '25–28 km/h', n: 12, tags: [{ type: 'nodrop', label: 'No Drop' }, { type: 'coffee', label: 'Coffee Stop' }] },

              {c.tags.map(t => <Badge key={t.label} type={t.type}>{t.label}</Badge>)}

        ))}

      <div style={{ margin: '8px 20px 32px', background: 'oklch(20% 0.05 250)', borderRadius: 12, padding: '18px 16px', color: 'white' }}>
