<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unknown Movement — UX/UI Direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: 'Geist', system-ui, sans-serif; }
  #root { width: 100%; height: 100%; }

  /* ── Unknown Movement Design Tokens ── */
  :root {
    --um-bg:        oklch(97.2% 0.004 240);
    --um-bg2:       oklch(94% 0.005 230);
    --um-surface:   oklch(99.5% 0.002 240);
    --um-border:    oklch(89% 0.006 230);
    --um-border-lt: oklch(93% 0.004 230);
    --um-text:      oklch(11% 0.008 250);
    --um-text-2:    oklch(40% 0.01 240);
    --um-text-3:    oklch(60% 0.008 230);
    --um-text-4:    oklch(75% 0.006 220);
    --um-accent:    oklch(62% 0.18 38);
    --um-accent-lt: oklch(94% 0.06 60);
    --um-radius:    6px;
    --um-radius-lg: 10px;
    --um-shadow:    0 1px 3px oklch(11% 0.008 250 / 0.05), 0 4px 12px oklch(11% 0.008 250 / 0.04);
    --um-shadow-md: 0 2px 8px oklch(11% 0.008 250 / 0.08), 0 8px 24px oklch(11% 0.008 250 / 0.06);
  }

  /* ── Screen shell ── */
  .um-screen {
    background: var(--um-bg);
    font-family: 'Geist', system-ui, sans-serif;
    color: var(--um-text);
    width: 390px;
    min-height: 844px;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    scrollbar-width: none;
  }
  .um-screen::-webkit-scrollbar { display: none; }

  /* ── Nav ── */
  .um-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px 16px;
    background: var(--um-surface);
    border-bottom: 1px solid var(--um-border-lt);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .um-logo {
    font-family: 'Geist', system-ui, sans-serif;
    font-style: normal;
    font-size: 17px;
    letter-spacing: -0.01em;
    color: var(--um-text);
  }
  .um-nav-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .um-nav-link {
    font-size: 12px;
    font-weight: 500;
    color: var(--um-text-3);
    letter-spacing: 0.01em;
  }
  .um-nav-cta {
    font-size: 12px;
    font-weight: 500;
    color: var(--um-text);
    letter-spacing: 0.01em;
    border-bottom: 1px solid var(--um-text);
    padding-bottom: 1px;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    cursor: pointer;
  }
  .um-nav-back {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--um-text-3);
    font-weight: 400;
  }

  /* ── Badges — smaller, quieter ── */
  .um-badge {
    display: inline-flex;
    align-items: center;
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 10px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .um-badge-ride    { background: oklch(94% 0.05 42);  color: oklch(38% 0.10 42); }
  .um-badge-run     { background: oklch(93% 0.04 220);  color: oklch(36% 0.09 220); }
  .um-badge-tri     { background: oklch(93% 0.04 290);  color: oklch(36% 0.09 290); }
  .um-badge-social  { background: var(--um-bg2);        color: var(--um-text-2);    border: 1px solid var(--um-border); }
  .um-badge-coffee  { background: oklch(95% 0.04 72);   color: oklch(40% 0.10 60); }
  .um-badge-nodrop  { background: oklch(93% 0.04 148);  color: oklch(36% 0.09 148); }
  .um-badge-tourist { background: oklch(93% 0.04 260);  color: oklch(36% 0.09 260); }
  .um-badge-beginner{ background: oklch(93% 0.04 148);  color: oklch(36% 0.09 148); }
  .um-badge-hard    { background: oklch(94% 0.04 20);   color: oklch(36% 0.10 20); }
  .um-badge-women   { background: oklch(94% 0.04 340);  color: oklch(36% 0.09 340); }
  .um-badge-tag     { background: var(--um-bg2);        color: var(--um-text-3);   border: 1px solid var(--um-border); }

  /* ── Buttons ── */
  .um-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 12px 22px;
    border-radius: var(--um-radius);
    border: none;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  .um-btn-primary   { background: var(--um-text);   color: white; }
  .um-btn-outline   { background: transparent; color: var(--um-text); border: 1px solid var(--um-border); }
  .um-btn-ghost     { background: var(--um-bg2); color: var(--um-text-2); }
  .um-btn-accent    { background: var(--um-accent);  color: white; }
  .um-btn-full      { width: 100%; }
  .um-btn-sm        { font-size: 12px; padding: 9px 16px; }

  /* ── Image placeholder — athlete imagery ── */
  .um-img-placeholder {
    position: relative;
    overflow: hidden;
    background: var(--um-bg2);
  }
  .um-img-stripes {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      -45deg,
      var(--um-border-lt) 0px,
      var(--um-border-lt) 1px,
      transparent 1px,
      transparent 12px
    );
  }
  .um-img-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
    font-size: 10px;
    color: var(--um-text-4);
    letter-spacing: 0.04em;
    text-align: center;
    line-height: 1.6;
    z-index: 1;
  }

  /* ── Hero ── */
  .um-hero {
    position: relative;
    background: var(--um-text);
    color: white;
    overflow: hidden;
  }
  .um-hero-img {
    width: 100%;
    height: 280px;
    position: relative;
  }
  .um-hero-img-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, oklch(11% 0.008 250 / 0.1) 0%, oklch(11% 0.008 250 / 0.75) 100%);
    z-index: 1;
  }
  .um-hero-content {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 0 24px 28px;
    z-index: 2;
  }
  .um-hero-eyebrow {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: oklch(78% 0.12 42);
    margin-bottom: 10px;
  }
  .um-hero-title {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 36px;
    font-weight: 400;
    line-height: 1.12;
    color: white;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .um-hero-title em {
    font-style: normal;
    font-weight: 300;
    color: oklch(87% 0.10 42);
  }
  .um-hero-sub {
    font-size: 13px;
    color: oklch(72% 0.005 240);
    line-height: 1.6;
    margin-bottom: 22px;
    font-weight: 400;
  }
  .um-hero-btns { display: flex; gap: 10px; }
  .um-hero-btn-primary {
    background: white; color: var(--um-text);
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 13px; font-weight: 500;
    padding: 11px 22px; border-radius: var(--um-radius); border: none;
    cursor: pointer; letter-spacing: 0.01em;
  }
  .um-hero-btn-secondary {
    background: transparent; color: white;
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 13px; font-weight: 400;
    padding: 11px 22px; border-radius: var(--um-radius);
    border: 1px solid oklch(100% 0 0 / 0.25);
    cursor: pointer; letter-spacing: 0.01em;
  }

  /* ── Divider label ── */
  .um-divider-label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 22px 12px;
  }
  .um-divider-label-text {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--um-text-3);
    white-space: nowrap;
  }
  .um-divider-line { flex: 1; height: 1px; background: var(--um-border-lt); }

  /* ── Session row (ruled list style) ── */
  .um-session-row {
    display: flex;
    align-items: stretch;
    padding: 18px 22px;
    border-bottom: 1px solid var(--um-border-lt);
    cursor: pointer;
    transition: background 0.12s;
    gap: 16px;
  }
  .um-session-row:hover { background: var(--um-surface); }
  .um-session-date-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 36px;
    padding-top: 2px;
    flex-shrink: 0;
  }
  .um-session-day {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 24px;
    font-weight: 400;
    line-height: 1;
    color: var(--um-text);
  }
  .um-session-dow {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--um-text-4);
    margin-top: 2px;
  }
  .um-session-bar {
    width: 1px;
    background: var(--um-border-lt);
    flex-shrink: 0;
    margin: 0 4px;
  }
  .um-session-body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .um-session-title {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.2;
    color: var(--um-text);
    letter-spacing: -0.01em;
  }
  .um-session-meta {
    font-size: 12px;
    color: var(--um-text-3);
    font-weight: 400;
    line-height: 1.4;
  }
  .um-session-stats {
    display: flex;
    gap: 14px;
    align-items: baseline;
    margin-top: 4px;
  }
  .um-session-stat-val {
    font-size: 13px;
    font-weight: 500;
    color: var(--um-text);
  }
  .um-session-stat-lbl {
    font-size: 10px;
    color: var(--um-text-4);
    margin-left: 2px;
  }
  .um-session-dot { width: 2px; height: 2px; border-radius: 50%; background: var(--um-border); flex-shrink: 0; align-self: center; }
  .um-session-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .um-session-tail {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-start;
    gap: 6px;
    flex-shrink: 0;
    padding-top: 2px;
  }
  .um-session-time {
    font-size: 12px;
    color: var(--um-text-3);
    font-weight: 400;
  }
  .um-session-joining {
    font-size: 11px;
    color: var(--um-text-4);
  }
  .um-session-joining strong { color: var(--um-text-2); font-weight: 500; }

  /* ── Filter chips — minimal ── */
  .um-chips {
    display: flex;
    gap: 6px;
    padding: 14px 22px 10px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--um-border-lt);
  }
  .um-chips::-webkit-scrollbar { display: none; }
  .um-chip {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 400;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--um-border);
    background: transparent;
    color: var(--um-text-3);
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.12s;
    letter-spacing: 0.01em;
  }
  .um-chip.active {
    background: var(--um-text);
    color: white;
    border-color: var(--um-text);
  }

  /* ── Stats strip ── */
  .um-stats-strip {
    display: flex;
    padding: 16px 22px;
    border-bottom: 1px solid var(--um-border-lt);
    background: var(--um-surface);
    gap: 0;
  }
  .um-stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-right: 1px solid var(--um-border-lt);
    padding: 0 8px;
  }
  .um-stat:first-child { align-items: flex-start; padding-left: 0; }
  .um-stat:last-child  { border-right: none; }
  .um-stat-num {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 26px;
    font-weight: 400;
    color: var(--um-text);
    line-height: 1;
  }
  .um-stat-lbl {
    font-size: 10px;
    color: var(--um-text-4);
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  /* ── Section label ── */
  .um-section-label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 20px 22px 0;
  }
  .um-section-title {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--um-text);
    letter-spacing: -0.01em;
  }
  .um-section-link {
    font-size: 11px;
    color: var(--um-text-3);
    font-weight: 400;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--um-border);
    cursor: pointer;
  }

  /* ── Event card — calendar style ── */
  .um-event-row {
    display: flex;
    gap: 14px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--um-border-lt);
    align-items: flex-start;
    cursor: pointer;
  }
  .um-event-date {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 36px;
  }
  .um-event-d {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 24px;
    font-weight: 400;
    line-height: 1;
    color: var(--um-text);
  }
  .um-event-m {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--um-text-4);
    margin-top: 2px;
  }
  .um-event-body { flex: 1; }
  .um-event-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--um-text);
    line-height: 1.3;
  }
  .um-event-meta { font-size: 12px; color: var(--um-text-3); margin-top: 3px; }

  /* ── Club row ── */
  .um-club-row {
    display: flex;
    gap: 14px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--um-border-lt);
    align-items: center;
    cursor: pointer;
  }
  .um-club-mark {
    width: 40px; height: 40px;
    border-radius: 6px;
    background: var(--um-text);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 15px;
    color: white;
    flex-shrink: 0;
  }
  .um-club-name { font-size: 14px; font-weight: 500; color: var(--um-text); }
  .um-club-meta { font-size: 12px; color: var(--um-text-3); margin-top: 2px; }

  /* ── Submit CTA block ── */
  .um-submit-cta {
    margin: 20px 22px 36px;
    padding: 24px 22px;
    border: 1px solid var(--um-border);
    border-radius: var(--um-radius-lg);
    background: var(--um-surface);
  }
  .um-submit-cta-title {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--um-text);
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .um-submit-cta-sub {
    font-size: 13px;
    color: var(--um-text-3);
    line-height: 1.55;
    margin-bottom: 18px;
    font-weight: 400;
  }

  /* ── Detail page ── */
  .um-detail-hero {
    position: relative;
    overflow: hidden;
  }
  .um-detail-hero-img {
    width: 100%;
    height: 220px;
    position: relative;
  }
  .um-detail-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, oklch(11% 0.008 250 / 0.05) 0%, oklch(11% 0.008 250 / 0.70) 100%);
    z-index: 1;
  }
  .um-detail-hero-content {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 0 22px 20px;
    z-index: 2;
    color: white;
  }
  .um-detail-title {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 26px;
    font-weight: 400;
    line-height: 1.15;
    color: white;
    letter-spacing: -0.01em;
    margin: 8px 0 4px;
  }
  .um-detail-meta {
    font-size: 12px;
    color: oklch(72% 0.005 240);
    line-height: 1.5;
  }
  .um-quick-stat-row {
    display: flex;
    border-bottom: 1px solid var(--um-border-lt);
    background: var(--um-surface);
  }
  .um-qs {
    flex: 1;
    padding: 16px 12px;
    border-right: 1px solid var(--um-border-lt);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .um-qs:last-child { border-right: none; }
  .um-qs-num {
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 24px;
    font-weight: 400;
    color: var(--um-text);
    line-height: 1;
  }
  .um-qs-unit { font-size: 12px; color: var(--um-text-3); }
  .um-qs-lbl { font-size: 10px; color: var(--um-text-4); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }

  .um-section { padding: 20px 22px; border-bottom: 1px solid var(--um-border-lt); }
  .um-section-hd {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--um-text-4);
    margin-bottom: 12px;
  }

  /* ── Suitability pills ── */
  .um-suit-grid { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── Organiser ── */
  .um-org-row { display: flex; gap: 12px; align-items: flex-start; }
  .um-org-mark {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--um-bg2);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 15px; color: var(--um-text-2);
    flex-shrink: 0;
    border: 1px solid var(--um-border);
  }
  .um-org-name { font-size: 14px; font-weight: 500; color: var(--um-text); }
  .um-org-sub { font-size: 12px; color: var(--um-text-3); margin-top: 2px; }
  .um-org-btns { display: flex; gap: 8px; margin-top: 10px; }

  /* ── Safety notes ── */
  .um-notes { display: flex; flex-direction: column; gap: 8px; }
  .um-note {
    display: flex;
    gap: 10px;
    font-size: 13px;
    color: var(--um-text-2);
    line-height: 1.5;
    align-items: flex-start;
  }
  .um-note-dash { color: var(--um-text-4); flex-shrink: 0; }

  /* ── Sticky CTA ── */
  .um-cta-strip {
    position: sticky;
    bottom: 0;
    background: var(--um-surface);
    border-top: 1px solid var(--um-border-lt);
    padding: 14px 22px;
    display: flex;
    gap: 8px;
  }

  /* ── Form ── */
  .um-stepper { display: flex; gap: 6px; padding: 18px 22px 0; }
  .um-step-seg {
    flex: 1; height: 2px; border-radius: 1px;
    background: var(--um-border-lt);
  }
  .um-step-seg.active { background: var(--um-text); }
  .um-step-label {
    font-size: 11px;
    color: var(--um-text-4);
    padding: 8px 22px 18px;
    font-weight: 400;
  }
  .um-step-label strong { color: var(--um-text); font-weight: 500; }
  .um-form-body { padding: 0 22px 120px; display: flex; flex-direction: column; gap: 20px; }
  .um-field { display: flex; flex-direction: column; gap: 6px; }

        <button className="um-btn um-btn-outline" style={{ flex: 1 }}>WhatsApp</button>
        <button className="um-btn um-btn-ghost" style={{ padding: '12px 14px' }}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v9M3 6l4-4 4 4M2 13h10" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────
   SCREEN 4 — SUBMIT FORM
───────────────────────────────────── */
function SubmitScreen() {
  const [step, setStep] = useState(1);
  const [coffee, setCoffee] = useState(true);
  const [nodrop, setNodrop] = useState(true);
  const [beginner, setBeginner] = useState(false);
  const [tourist, setTourist] = useState(false);

  return (
    <div className="um-screen">
      <div className="um-nav">
        <div className="um-nav-back">
          <span style={{ fontSize: 18, lineHeight: 1 }}>←</span>
          <span>Submit a session</span>
        </div>
        <button style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 16, color: 'var(--um-text-3)' }}>✕</button>
      </div>

      {/* Stepper */}
      <div className="um-stepper">
        <div className={`um-step-seg ${step >= 1 ? 'active' : ''}`}></div>
        <div className={`um-step-seg ${step >= 2 ? 'active' : ''}`}></div>
        <div className={`um-step-seg ${step >= 3 ? 'active' : ''}`}></div>
      </div>
      <div className="um-step-label">
        <strong>Step {step} of 3</strong> — {step === 1 ? 'Core details' : step === 2 ? 'Session details' : 'Organiser & visibility'}
      </div>

      {step === 1 && (
        <div className="um-form-body">
          <div className="um-field">
            <label className="um-field-label">Session title</label>
            <input className="um-input" placeholder="e.g. Colombo Coffee Loop" />
          </div>
          <div className="um-field">
            <label className="um-field-label">Activity type</label>
            <div className="um-type-grid">
              <div className="um-type-btn sel">Ride</div>
              <div className="um-type-btn">Run</div>
              <div className="um-type-btn">Triathlon</div>
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <div className="um-field">
              <label className="um-field-label">Date</label>
              <input className="um-input" type="date" defaultValue="2026-05-03" />
            </div>
            <div className="um-field">
              <label className="um-field-label">Start time</label>
              <input className="um-input" type="time" defaultValue="06:00" />
            </div>
          </div>
          <div className="um-field">
            <label className="um-field-label">City / area</label>
            <select className="um-select">
              <option>Colombo</option>
              <option>Kandy</option>
              <option>Galle</option>
              <option>Negombo</option>
              <option>Other</option>
            </select>
          </div>
          <div className="um-field">
            <label className="um-field-label">Start location</label>
            <input className="um-input" placeholder="e.g. Independence Square, Colombo 7" />
          </div>
          <div className="um-field">
            <label className="um-field-label">Difficulty</label>
            <div className="um-diff-grid">
              {['Easy', 'Social', 'Moderate', 'Hard'].map((d, i) => (
                <div key={d} className={`um-diff-btn ${i === 1 ? 'sel' : ''}`}>{d}</div>
              ))}
            </div>
          </div>
        </div>
      )}

      {step === 2 && (
        <div className="um-form-body">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <div className="um-field">
              <label className="um-field-label">Distance (km)</label>
              <input className="um-input" placeholder="42" />
            </div>
            <div className="um-field">
              <label className="um-field-label">Duration</label>
              <input className="um-input" placeholder="e.g. 2 hr" />
            </div>
          </div>
          <div className="um-field">
            <label className="um-field-label">Pace or average speed</label>
            <input className="um-input" placeholder="e.g. 25–28 km/h or 5:30/km" />
          </div>
          <div className="um-field">
            <label className="um-field-label">Route link</label>
            <input className="um-input" placeholder="Strava, Komoot, or Google Maps (optional)" />
          </div>
          <div style={{ borderTop: '1px solid var(--um-border-lt)', paddingTop: 6 }}>
            <div className="um-field-label" style={{ marginBottom: 4 }}>Session tags</div>
            <p style={{ fontSize: 12, color: 'var(--um-text-4)', marginBottom: 14 }}>Helps riders find and assess your session.</p>
            {[
              { label: 'Coffee stop', sub: 'Ends at a café', val: coffee, set: setCoffee },
              { label: 'No drop', sub: 'No one gets left behind', val: nodrop, set: setNodrop },
              { label: 'Beginner friendly', sub: null, val: beginner, set: setBeginner },
              { label: 'Tourist friendly', sub: 'Open to visitors', val: tourist, set: setTourist },
            ].map(t => (
              <div key={t.label} className="um-toggle-row">
                <div>
                  <div className="um-toggle-name">{t.label}</div>
                  {t.sub && <div className="um-toggle-desc">{t.sub}</div>}
                </div>
                <button className={`um-toggle ${t.val ? 'on' : 'off'}`} onClick={() => t.set(v => !v)}></button>
              </div>
            ))}
          </div>
        </div>
      )}

      {step === 3 && (
        <div className="um-form-body">
          <div className="um-field">
            <label className="um-field-label">Organiser name or club</label>
            <input className="um-input" placeholder="e.g. Colombo Cycling Club" />
          </div>
          <div className="um-field">
            <label className="um-field-label">WhatsApp contact</label>
            <input className="um-input" placeholder="+94 77 000 0000" />
          </div>
          <div className="um-field">
            <label className="um-field-label">Strava club link</label>
            <input className="um-input" placeholder="strava.com/clubs/… (optional)" />
          </div>
          <div style={{ borderTop: '1px solid var(--um-border-lt)', paddingTop: 6 }}>
            <div className="um-field-label" style={{ marginBottom: 12 }}>Activity visibility</div>
            <div className="um-radio-col">
              {[
                { val: 'public', label: 'Public', sub: 'Visible to everyone on Unknown Movement' },
                { val: 'unlisted', label: 'Unlisted', sub: 'Only via direct link' },
                { val: 'private', label: 'Private', sub: 'Invite only' },
              ].map((opt, i) => (
                <div key={opt.val} className="um-radio-row">
                  <div className={`um-radio-dot ${i === 0 ? 'sel' : ''}`}></div>
                  <div>
                    <div className="um-radio-label">{opt.label}</div>
                    <div className="um-radio-sub">{opt.sub}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="um-field">
            <label className="um-field-label">Attendee visibility</label>
            <select className="um-select">
              <option>Show count only (recommended)</option>
              <option>Show names</option>
              <option>Hide attendee info</option>
            </select>
          </div>
        </div>
      )}

      {/* Form nav */}
      <div className="um-form-nav">
        {step > 1 && (
          <button className="um-btn um-btn-outline" style={{ flex: 1 }} onClick={() => setStep(s => s - 1)}>Back</button>
        )}
        {step < 3 ? (
          <button className="um-btn um-btn-primary" style={{ flex: 2 }} onClick={() => setStep(s => s + 1)}>Continue</button>
        ) : (
          <button className="um-btn um-btn-primary" style={{ flex: 2 }}>Submit session</button>
        )}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────
   MAIN APP
───────────────────────────────────── */
function App() {
  return (
    <DesignCanvas title="Unknown Movement" subtitle="Refined MVP · Ultra-minimal premium · Mobile-first · May 2026">
      <DCSection id="mvp" title="MVP Screens — Unknown Movement">
        <DCArtboard id="home"    label="01 Homepage"         width={390} height={900}>
          <HomeScreen />
        </DCArtboard>
        <DCArtboard id="explore" label="02 Explore Sessions" width={390} height={900}>
          <ExploreScreen />
        </DCArtboard>
        <DCArtboard id="detail"  label="03 Activity Detail"  width={390} height={900}>
          <DetailScreen />
        </DCArtboard>
        <DCArtboard id="submit"  label="04 Submit Activity"  width={390} height={900}>
          <SubmitScreen />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
